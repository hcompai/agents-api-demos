name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          python-version: "3.12"

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Lint Python
        run: uv run --no-sync ruff check .

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

      - name: Type-check Python
        run: uv run --no-sync mypy examples

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install locked npm dependencies
        run: npm ci
        working-directory: examples/product_availability

      - name: Build the software QA demo app
        run: npm ci && npm run build
        working-directory: examples/software_qa
