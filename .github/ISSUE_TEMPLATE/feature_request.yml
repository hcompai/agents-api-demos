name: Feature request
description: Suggest a new example, skill, or improvement to an existing recipe.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! This repo is a collection of recipes for the `hai-agents` SDK —
        new examples and skills are very welcome.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - New example / recipe
        - New skill
        - Improvement to an existing example or skill
        - Docs / README
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do with the SDK that the current examples don't cover?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the example, skill, or change you'd like to see. Sketch the tool/CLI surface if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
