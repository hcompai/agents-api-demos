[project]
name = "agents-api-demos"
version = "0.1.0"
description = "Demo recipes for the hai-agents Python SDK, wired up as MCP servers for Claude Code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hai-agents>=1.2.6,<2",
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "tyro>=0.8.14",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "playwright>=1.40",
    "httpx>=0.27",         # the SDK's transport; we catch httpx.TransportError to survive poll blips
]

[project.optional-dependencies]
local = ["hai-agents[desktop,workstation]>=1.2.6,<2"]

[project.scripts]
hai-agents-demos-qa = "examples.qa.mcp.server:main"
hai-agents-demos-extract-anything = "examples.extract_anything.server:main"
debug-qa = "examples.qa.mcp.debug:main"
qa-cli = "examples.qa.cli.main:main"
counterfeit-cli = "examples.counterfeit_detection.main:main"
extract-cli = "examples.extract_anything.cli:main"
print-cli = "examples.design_and_print.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
ignore_missing_imports = true
