[project]
name = "hai-agent-demos"
version = "0.1.0"
description = "Demo recipes for the hai-agents Python SDK, wired up as MCP servers for Claude Code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hai-agents>=0.1.7",   # 0.1.7 ships custom tools (@tool + run_session tools=...)
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "tyro>=0.9",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "playwright>=1.40",
]

[project.scripts]
hai-agent-demos-qa = "examples.qa.mcp.server:main"
hai-agent-demos-extract-anything = "examples.extract_anything.server:main"
debug-qa = "examples.qa.mcp.debug:main"
qa-cli = "examples.qa.cli.main:main"
counterfeit-cli = "examples.counterfeit_detection.main:main"
extract-cli = "examples.extract_anything.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: hits a live Agent Platform backend (requires H_API_KEY)",
    "slow: integration tests that consume significant tokens or wall-clock time",
]

[tool.mypy]
strict = true
# fastmcp + a few hai_agents internals don't ship ``py.typed``; treat them as untyped imports
# rather than failing every reference to them.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The SDK's ``tool()`` decorator factory is typed ``-> Any`` (it returns either a ``Tool`` or a
# wrapping closure depending on call form), which trips ``untyped-decorator`` on every
# ``@tool(name=...)`` use. The decorator IS the pattern this example teaches, so silence that one
# code here rather than dodge the public API.
module = "examples.counterfeit_detection.local_tools"
disable_error_code = ["untyped-decorator"]
