[project]
name = "agent-sdk-demo"
version = "0.1.0"
description = "Demo recipes for the hai-agents Python SDK, wired up as MCP servers for Claude Code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hai-agents>=0.1",
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "tyro>=0.9",
    "python-dotenv>=1.0",
]

[project.scripts]
agent-sdk-demo-qa = "examples.qa_mcp.server:main"
debug-qa = "examples.qa_mcp.debug:main"
qa-cli = "examples.qa_cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"
